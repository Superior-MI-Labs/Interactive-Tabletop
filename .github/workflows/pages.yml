name: Deploy Interactive Tabletop Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/**'
      - 'tests/**'
      - 'vendor/**'
      - 'main.py'
      - 'desktop.py'
      - 'README.md'
      - 'INSTALL.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and release contracts
        run: |
          python -I -S -m unittest discover -s tests -p 'test_*.py' -v
          for test in tests/test_*.js; do node "$test"; done
      - name: Build desktop download and public site from canonical source
        run: |
          python tools/build_release.py
          python tools/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4
